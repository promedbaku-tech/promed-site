<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promed</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb}
header{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;background:#0ea5e9;color:white;position:sticky;top:0;z-index:1000}
.logo{font-size:24px;font-weight:800;cursor:pointer}
.hamburger{width:32px;height:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.hamburger span{height:4px;background:white;border-radius:10px}
.side{position:fixed;top:0;right:-310px;width:290px;height:100vh;background:white;box-shadow:-8px 0 25px rgba(0,0,0,.25);padding:75px 20px 20px;transition:.3s;z-index:9999}
.side.open{right:0}
.close-btn{position:absolute;top:18px;right:22px;font-size:36px;color:#0ea5e9;cursor:pointer;font-weight:bold}
.side button{width:100%;margin:8px 0;padding:13px;border:none;border-radius:10px;background:#f1f5f9;cursor:pointer;font-size:15px;font-weight:700}
.lang-list{display:none}
.lang-list button{background:#e0f2fe}
.page{display:none}
.page.active{display:block}
.slider{position:relative;height:370px;overflow:hidden}
.slide{position:absolute;width:100%;height:100%;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
.overlay{position:absolute;width:100%;height:100%;background:rgba(0,0,0,.45)}
.slider-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;text-align:center;width:90%}
.slider-text h1{font-size:40px;margin:0}
.slider-text p{font-size:18px}
.section-title{text-align:center;font-size:30px;margin:45px 0 20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;padding:25px}
.card{background:white;border-radius:18px;padding:16px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.1);transition:.3s}
.card:hover{transform:translateY(-6px)}
.card img{width:100%;height:200px;object-fit:cover;border-radius:14px}
.card p{line-height:1.5;color:#475569}
.btn{margin:8px 4px 0;padding:11px 15px;border:none;border-radius:10px;cursor:pointer;font-weight:700}
.order-btn{background:#0ea5e9;color:white}
.cart-btn{background:#22c55e;color:white}
.content-page{max-width:900px;margin:50px auto;background:white;padding:35px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.1)}
.content-page h1{margin-top:0;color:#0ea5e9}
.content-page p{white-space:pre-line;line-height:1.7}
.contact-form input,.contact-form textarea{width:100%;padding:12px;margin-top:10px;border:1px solid #ddd;border-radius:8px}
.contact-form textarea{height:120px}
.back-btn,.send-btn{background:#0ea5e9;color:white;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:700;margin-top:20px}
.send-btn{background:#22c55e}
.cart{position:fixed;right:20px;bottom:20px;background:white;padding:15px 18px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.25);z-index:1000;font-weight:700;cursor:pointer}
.cart-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:10000}
.cart-box{background:white;width:90%;max-width:420px;margin:90px auto;padding:25px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.cart-box h2{margin-top:0;color:#0ea5e9}
.cart-item{padding:10px;background:#f1f5f9;border-radius:10px;margin:8px 0}
.cart-actions button{width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:700}
.whatsapp{background:#22c55e;color:white}
.clear{background:#ef4444;color:white}
.close{background:#0ea5e9;color:white}
footer{background:#0ea5e9;color:white;text-align:center;padding:18px;margin-top:40px}
@media(max-width:600px){.slider{height:300px}.slider-text h1{font-size:30px}.side{width:270px}}
</style>
</head>

<body>

<header>
<div class="logo" onclick="showPage('home')">Promed</div>
<div class="hamburger" onclick="openMenu()"><span></span><span></span><span></span></div>
</header>

<div class="side" id="side">
<div class="close-btn" onclick="closeMenu()">&times;</div>
<button id="menuAbout" onclick="showPage('about')"></button>
<button id="menuProducts" onclick="showPage('home')"></button>
<button id="menuContact" onclick="showPage('contact')"></button>
<button id="menuLang" onclick="toggleLang()"></button>
<div class="lang-list" id="langList">
<button onclick="setLang('az')">Az&#601;rbaycan</button>
<button onclick="setLang('ru')">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</button>
<button onclick="setLang('en')">English</button>
</div>
</div>

<div id="home" class="page active">
<div class="slider">
<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1580281657527-47df0c5d0f6c?auto=format&fit=crop&w=1600&q=80')"></div>
<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1600&q=80')"></div>
<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1f?auto=format&fit=crop&w=1600&q=80')"></div>
<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1537368910025-700350fe46c7?auto=format&fit=crop&w=1600&q=80')"></div>
<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1581595219315-a187dd40c322?auto=format&fit=crop&w=1600&q=80')"></div>
<div class="overlay"></div>
<div class="slider-text"><h1 id="title"></h1><p id="subtitle"></p></div>
</div>

<section id="products">
<h2 class="section-title" id="productsTitle"></h2>
<div class="products" id="productsList"></div>
</section>
</div>

<div id="about" class="page">
<div class="content-page">
<h1 id="aboutTitle"></h1>
<p id="aboutText"></p>
<button class="back-btn" id="backBtn1" onclick="showPage('home')"></button>
</div>
</div>

<div id="contact" class="page">
<div class="content-page">
<h1 id="contactTitle"></h1>
<p id="contactText"></p>
<hr>
<h3 id="contactFormTitle"></h3>
<div class="contact-form">

<input id="emailInput" placeholder="">
<textarea id="messageInput" placeholder=""></textarea>
<button class="send-btn" id="sendBtn" onclick="sendMessage()"></button>
</div>
<button class="back-btn" id="backBtn2" onclick="showPage('home')"></button>
</div>
</div>

<div class="cart" onclick="openCart()"><span id="cartLabel"></span>: <span id="cartCount">0</span></div>

<div class="cart-modal" id="cartModal">
<div class="cart-box">
<h2 id="cartTitle"></h2>
<div id="cartItems"></div>
<div class="cart-actions">
<button class="whatsapp" id="orderAllBtn" onclick="orderAll()"></button>
<button class="clear" id="clearCartBtn" onclick="clearCart()"></button>
<button class="close" id="closeCartBtn" onclick="closeCart()"></button>
</div>
</div>

<script>
let currentLang="az";
let productsData=[];

function openMenu(){document.getElementById("side").classList.add("open")}
function closeMenu(){document.getElementById("side").classList.remove("open")}
function showPage(page){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(page).classList.add("active");closeMenu();window.scrollTo(0,0)}
function toggleLang(){let x=document.getElementById("langList");x.style.display=x.style.display==="block"?"none":"block"}

let slides=document.querySelectorAll(".slide");
let slideIndex=0;
function showSlide(){slides.forEach((s,i)=>{s.style.opacity=i===slideIndex?"1":"0"});slideIndex=(slideIndex+1)%slides.length}
showSlide();setInterval(showSlide,3000);

let cart=JSON.parse(localStorage.getItem("promedCart"))||[];
function updateCartCount(){document.getElementById("cartCount").innerText=cart.length}
function addToCart(item){cart.push(item);localStorage.setItem("promedCart",JSON.stringify(cart));updateCartCount()}
function openCart(){document.getElementById("cartModal").style.display="block";renderCart()}
function closeCart(){document.getElementById("cartModal").style.display="none"}
function renderCart(){let box=document.getElementById("cartItems");box.innerHTML="";if(cart.length===0){box.innerHTML="<p>"+lang[currentLang].emptyCart+"</p>";return}cart.forEach((item,index)=>{box.innerHTML+="<div class='cart-item'>"+(index+1)+". "+item+"</div>"})}
function clearCart(){cart=[];localStorage.setItem("promedCart",JSON.stringify(cart));updateCartCount();renderCart()}
function order(name){let phone="994502123524";let msg="Salam, "+name+" sifaris etmek isteyirem";window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank")}
function orderAll(){if(cart.length===0){alert(lang[currentLang].emptyCart);return}let phone="994502123524";let msg="Salam, bu mehsullari sifaris etmek isteyirem: "+cart.join(", ");window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank")}
function sendMessage(){let name=document.getElementById("nameInput").value;let email=document.getElementById("emailInput").value;let message=document.getElementById("messageInput").value;let phone="994502123524";let msg="Salam, menim adim: "+name+"%0AEmail: "+email+"%0AMesaj: "+message;window.open("https://wa.me/"+phone+"?text="+msg,"_blank")}

function getProductName(p){
return p.name || p.title || "Məhsul";
}

function getProductDescription(p){
return p.description || p.info || "";
}

function getProductImage(p){
return p.image || p.photo || "https://via.placeholder.com/400x250";
}

function renderProducts(){
let container=document.getElementById("productsList");
container.innerHTML="";

if(!productsData || productsData.length===0){
container.innerHTML="<p style='text-align:center;width:100%;grid-column:1/-1;'>"+lang[currentLang].noProducts+"</p>";
return;
}

productsData.forEach((p)=>{
let name=getProductName(p);
let description=getProductDescription(p);
let image=getProductImage(p);

container.innerHTML += `
<div class="card">
<img src="${image}" alt="${name}">
<h3>${name}</h3>
<p>${description}</p>
<button class="btn cart-btn" onclick="addToCart('${name.replace(/'/g,"\\'")}')">${lang[currentLang].cart}</button>
<button class="btn order-btn" onclick="order('${name.replace(/'/g,"\\'")}')">${lang[currentLang].order}</button>
</div>
`;
});
}

function loadProducts(){
fetch("data/products.json")
.then(res=>{
if(!res.ok){throw new Error("products.json tapilmadi")}
return res.json();
})
.then(data=>{
productsData=Array.isArray(data) ? data : [];
renderProducts();
})
.catch(()=>{
productsData=[
{name:"Cərrahi əlcək",image:"https://images.unsplash.com/photo-1580281658223-9b93f18ae9ae?auto=format&fit=crop&w=800&q=80",description:"Keyfiyyətli cərrahi əlcək"},
{name:"Şpris",image:"https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=800&q=80",description:"Steril tibbi şpris"},
{name:"Stetoskop",image:"https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b?auto=format&fit=crop&w=800&q=80",description:"Peşəkar istifadə üçün stetoskop"}
];
renderProducts();
});
}
