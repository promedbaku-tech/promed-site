<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promed</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb}header{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;background:#0ea5e9;color:white;position:sticky;top:0;z-index:1000}.logo{font-size:24px;font-weight:800;cursor:pointer}.hamburger{width:32px;height:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.hamburger span{height:4px;background:white;border-radius:10px}.side{position:fixed;top:0;right:-310px;width:290px;height:100vh;background:white;box-shadow:-8px 0 25px rgba(0,0,0,.25);padding:75px 20px 20px;transition:.3s;z-index:9999}.side.open{right:0}.close-btn{position:absolute;top:18px;right:22px;font-size:36px;color:#0ea5e9;cursor:pointer;font-weight:bold}.side button{width:100%;margin:8px 0;padding:13px;border:none;border-radius:10px;background:#f1f5f9;cursor:pointer;font-size:15px;font-weight:700}.lang-list{display:none}.lang-list button{background:#e0f2fe}.page{display:none}.page.active{display:block}.slider{position:relative;height:370px;overflow:hidden}.slide{position:absolute;width:100%;height:100%;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}.overlay{position:absolute;width:100%;height:100%;background:rgba(0,0,0,.45)}.slider-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;text-align:center;width:90%}.slider-text h1{font-size:40px;margin:0}.slider-text p{font-size:18px}.section-title{text-align:center;font-size:30px;margin:45px 0 20px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;padding:25px}.card{background:white;border-radius:18px;padding:16px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.1);transition:.3s}.card:hover{transform:translateY(-6px)}.card img{width:100%;height:200px;object-fit:cover;border-radius:14px}.card p{line-height:1.5;color:#475569}.btn{margin:8px 4px 0;padding:11px 15px;border:none;border-radius:10px;cursor:pointer;font-weight:700}.order-btn{background:#0ea5e9;color:white}.cart-btn{background:#22c55e;color:white}.content-page{max-width:900px;margin:50px auto;background:white;padding:35px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.1)}.content-page h1{margin-top:0;color:#0ea5e9}.content-page p{white-space:pre-line;line-height:1.7}.contact-form input,.contact-form textarea{width:100%;padding:12px;margin-top:10px;border:1px solid #ddd;border-radius:8px}.contact-form textarea{height:120px}.back-btn,.send-btn{background:#0ea5e9;color:white;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:700;margin-top:20px}.send-btn{background:#22c55e}.cart{position:fixed;right:20px;bottom:20px;background:white;padding:15px 18px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.25);z-index:1000;font-weight:700;cursor:pointer}.cart-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:10000}.cart-box{background:white;width:90%;max-width:420px;margin:90px auto;padding:25px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}.cart-box h2{margin-top:0;color:#0ea5e9}.cart-item{padding:10px;background:#f1f5f9;border-radius:10px;margin:8px 0}.cart-actions button{width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:700}.whatsapp{background:#22c55e;color:white}.clear{background:#ef4444;color:white}.close{background:#0ea5e9;color:white}footer{background:#0ea5e9;color:white;text-align:center;padding:18px;margin-top:40px}@media(max-width:600px){.slider{height:300px}.slider-text h1{font-size:30px}.side{width:270px}}
</style>
</head>
<body>
<header><div class="logo" onclick="showPage('home')">Promed</div><div class="hamburger" onclick="openMenu()"><span></span><span></span><span></span></div></header>
<div class="side" id="side"><div class="close-btn" onclick="closeMenu()">&times;</div><button id="menuAbout" onclick="showPage('about')"></button><button id="menuProducts" onclick="showPage('home')"></button><button id="menuContact" onclick="showPage('contact')"></button><button id="menuLang" onclick="toggleLang()"></button><div class="lang-list" id="langList"><button onclick="setLang('az')">Azərbaycan</button><button onclick="setLang('ru')">Русский</button><button onclick="setLang('en')">English</button></div></div>
<div id="home" class="page active"><div class="slider"><div class="slide" style="background-image:url('https://images.unsplash.com/photo-1580281657527-47df0c5d0f6c?auto=format&fit=crop&w=1600&q=80')"></div><div class="slide" style="background-image:url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1600&q=80')"></div><div class="slide" style="background-image:url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1f?auto=format&fit=crop&w=1600&q=80')"></div><div class="slide" style="background-image:url('https://images.unsplash.com/photo-1537368910025-700350fe46c7?auto=format&fit=crop&w=1600&q=80')"></div><div class="slide" style="background-image:url('https://images.unsplash.com/photo-1581595219315-a187dd40c322?auto=format&fit=crop&w=1600&q=80')"></div><div class="overlay"></div><div class="slider-text"><h1 id="title"></h1><p id="subtitle"></p></div></div><section id="products"><h2 class="section-title" id="productsTitle"></h2><div class="products" id="productsList"></div></section></div>
<div id="about" class="page"><div class="content-page"><h1 id="aboutTitle"></h1><p id="aboutText"></p><button class="back-btn" id="backBtn1" onclick="showPage('home')"></button></div></div>
<div id="contact" class="page"><div class="content-page"><h1 id="contactTitle"></h1><p id="contactText"></p><hr><h3 id="contactFormTitle"></h3><div class="contact-form"><input id="nameInput"><input id="emailInput"><textarea id="messageInput"></textarea><button class="send-btn" id="sendBtn" onclick="sendMessage()"></button></div><button class="back-btn" id="backBtn2" onclick="showPage('home')"></button></div></div>
<div class="cart" onclick="openCart()"><span id="cartLabel"></span>: <span id="cartCount">0</span></div><div class="cart-modal" id="cartModal"><div class="cart-box"><h2 id="cartTitle"></h2><div id="cartItems"></div><div class="cart-actions"><button class="whatsapp" id="orderAllBtn" onclick="orderAll()"></button><button class="clear" id="clearCartBtn" onclick="clearCart()"></button><button class="close" id="closeCartBtn" onclick="closeCart()"></button></div></div></div><footer>&copy; 2026 Promed</footer>
<script>
let currentLang="az";let productsData=[];function openMenu(){document.getElementById("side").classList.add("open")}function closeMenu(){document.getElementById("side").classList.remove("open")}function showPage(page){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(page).classList.add("active");closeMenu();window.scrollTo(0,0)}function toggleLang(){let x=document.getElementById("langList");x.style.display=x.style.display==="block"?"none":"block"}let slides=document.querySelectorAll(".slide");let slideIndex=0;function showSlide(){slides.forEach((s,i)=>{s.style.opacity=i===slideIndex?"1":"0"});slideIndex=(slideIndex+1)%slides.length}showSlide();setInterval(showSlide,3000);let cart=JSON.parse(localStorage.getItem("promedCart"))||[];function updateCartCount(){document.getElementById("cartCount").innerText=cart.length}function addToCart(item){cart.push(item);localStorage.setItem("promedCart",JSON.stringify(cart));updateCartCount()}function openCart(){document.getElementById("cartModal").style.display="block";renderCart()}function closeCart(){document.getElementById("cartModal").style.display="none"}function renderCart(){let box=document.getElementById("cartItems");box.innerHTML="";if(cart.length===0){box.innerHTML="<p>"+lang[currentLang].emptyCart+"</p>";return}cart.forEach((item,index)=>{box.innerHTML+="<div class='cart-item'>"+(index+1)+". "+item+"</div>"})}function clearCart(){cart=[];localStorage.setItem("promedCart",JSON.stringify(cart));updateCartCount();renderCart()}function order(name){let phone="994502123524";let msg="Salam, "+name+" sifariş etmək istəyirəm";window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank")}function orderAll(){if(cart.length===0){alert(lang[currentLang].emptyCart);return}let phone="994502123524";let msg="Salam, bu məhsulları sifariş etmək istəyirəm: "+cart.join(", ");window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank")}function sendMessage(){let name=document.getElementById("nameInput").value;let email=document.getElementById("emailInput").value;let message=document.getElementById("messageInput").value;let phone="994502123524";let msg="Salam, mənim adım: "+name+"%0AEmail: "+email+"%0AMesaj: "+message;window.open("https://wa.me/"+phone+"?text="+msg,"_blank")}function safeText(value){return String(value||"").replace(/'/g,"\'")}function renderProducts(){let container=document.getElementById("productsList");container.innerHTML="";if(!productsData.length){container.innerHTML="<p style='text-align:center;width:100%;grid-column:1/-1;'>"+lang[currentLang].noProducts+"</p>";return}productsData.forEach((p)=>{let name=p.name||"Məhsul";let description=p.description||"";let image=p.image||"https://via.placeholder.com/400x250";container.innerHTML+=`<div class="card"><img src="${image}" alt="${name}"><h3>${name}</h3><p>${description}</p><button class="btn cart-btn" onclick="addToCart('${safeText(name)}')">${lang[currentLang].cart}</button><button class="btn order-btn" onclick="order('${safeText(name)}')">${lang[currentLang].order}</button></div>`})}function loadProducts(){fetch("data/products.json?v="+Date.now()).then(r=>r.json()).then(data=>{productsData=data.products||[];renderProducts()}).catch(()=>{productsData=[];renderProducts()})}
let lang={az:{menuAbout:"Haqqımızda",menuProducts:"Məhsullar",menuContact:"Əlaqə",menuLang:"Dil ▾",title:"Tibbi Avadanlıqlar",subtitle:"Keyfiyyət və etibar",productsTitle:"Məhsullar",aboutTitle:"Promed MMC haqqında məlumat",aboutText:"Şirkətimiz Promed MMC 2003-cü ildə (əvvəlki adı Kron Ltd) kimi təsis edilmişdir. Şirkətin əsas fəaliyyət istiqaməti tibbi avadanlıqlar, cərrahi alətlər və istehlak materiallarının satışıdır.\n\nPromed MMC-də hazırda 8 nəfər çalışır: onların 3-ü tibbi avadanlıqların texniki xidməti üzrə mühəndis, 2-si marketinq şöbəsində, 1-i satış üzrə mütəxəssis, 1-i mühasib, digəri isə mən – şirkətin sahibi və direktoru Bəhram Bəliyev.\n\nİllik dövriyyəmiz təxminən 1,5 milyon ABŞ dolları təşkil edir.\n\nBiz tibbi avadanlıqlar sahəsində Çindən Comen, Pioway, Biobase, Heal Force, həmçinin Rusiya, Avropa ölkələri, Koreyadan Stratek Co. Ltd və Poskom Co. Ltd şirkətləri ilə əməkdaşlıq edirik.\n\nBizim Bakı şəhərində yerləşən emalatxanamız, anbarımız və satış salonumuz mövcuddur. Ümumi sahə 350 m² təşkil edir.\n\nYeni əməkdaşlıq qurmağa açığıq.\n\nHörmətlə,\nBəhram Bəliyev\nPromed MMC-nin sahibi və direktoru",contactTitle:"Əlaqə",contactText:"Əlaqə nömrəsi: +994 50 212 35 24",contactFormTitle:"Mesaj göndər",order:"Sifariş et",cart:"Səbətə əlavə et",back:"Geri qayıt",cartLabel:"Səbət",cartTitle:"Səbət",orderAll:"Hamısını sifariş et",clearCart:"Səbəti təmizlə",closeCart:"Bağla",emptyCart:"Səbət boşdur",send:"Göndər",name:"Ad",email:"Email",message:"Mesaj",noProducts:"Məhsul yoxdur"},ru:{menuAbout:"О нас",menuProducts:"Товары",menuContact:"Контакты",menuLang:"Язык ▾",title:"Медицинское оборудование",subtitle:"Качество и доверие",productsTitle:"Товары",aboutTitle:"О компании Promed MMC",aboutText:"Promed MMC была основана в 2003 году. Компания занимается продажей медицинского оборудования, хирургических инструментов и расходных материалов.",contactTitle:"Контакты",contactText:"Номер: +994 50 212 35 24",contactFormTitle:"Отправить сообщение",order:"Заказать",cart:"В корзину",back:"Назад",cartLabel:"Корзина",cartTitle:"Корзина",orderAll:"Заказать все",clearCart:"Очистить",closeCart:"Закрыть",emptyCart:"Корзина пуста",send:"Отправить",name:"Имя",email:"Email",message:"Сообщение",noProducts:"Товаров нет"},en:{menuAbout:"About Us",menuProducts:"Products",menuContact:"Contact",menuLang:"Language ▾",title:"Medical Equipment",subtitle:"Quality and trust",productsTitle:"Products",aboutTitle:"About Promed MMC",aboutText:"Promed MMC was founded in 2003. The company specializes in the sale of medical equipment, surgical instruments, and consumable materials.",contactTitle:"Contact",contactText:"Contact number: +994 50 212 35 24",contactFormTitle:"Send message",order:"Order",cart:"Add to cart",back:"Back",cartLabel:"Cart",cartTitle:"Cart",orderAll:"Order all",clearCart:"Clear cart",closeCart:"Close",emptyCart:"Cart is empty",send:"Send",name:"Name",email:"Email",message:"Message",noProducts:"No products"}};
function setLang(l){currentLang=l;document.getElementById("menuAbout").innerText=lang[l].menuAbout;document.getElementById("menuProducts").innerText=lang[l].menuProducts;document.getElementById("menuContact").innerText=lang[l].menuContact;document.getElementById("menuLang").innerText=lang[l].menuLang;document.getElementById("title").innerText=lang[l].title;document.getElementById("subtitle").innerText=lang[l].subtitle;document.getElementById("productsTitle").innerText=lang[l].productsTitle;document.getElementById("aboutTitle").innerText=lang[l].aboutTitle;document.getElementById("aboutText").innerText=lang[l].aboutText;document.getElementById("contactTitle").innerText=lang[l].contactTitle;document.getElementById("contactText").innerText=lang[l].contactText;document.getElementById("contactFormTitle").innerText=lang[l].contactFormTitle;document.getElementById("backBtn1").innerText=lang[l].back;document.getElementById("backBtn2").innerText=lang[l].back;document.getElementById("cartTitle").innerText=lang[l].cartTitle;document.getElementById("cartLabel").innerText=lang[l].cartLabel;document.getElementById("orderAllBtn").innerText=lang[l].orderAll;document.getElementById("clearCartBtn").innerText=lang[l].clearCart;document.getElementById("closeCartBtn").innerText=lang[l].closeCart;document.getElementById("sendBtn").innerText=lang[l].send;document.getElementById("nameInput").placeholder=lang[l].name;document.getElementById("emailInput").placeholder=lang[l].email;document.getElementById("messageInput").placeholder=lang[l].message;renderProducts();renderCart();closeMenu()}updateCartCount();setLang("az");loadProducts();
</script>
</body>
</html>
